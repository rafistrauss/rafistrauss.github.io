# Build & deploy site to Github Pages & rafistrauss.com
name: Deploy GH Pages & rafistrauss.com
on:
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  deployGithubPagesAndMainSite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build Sitemap
        run: pnpm run prebuild
      - name: Build site
        run: pnpm run build
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
      - name: Deploy to rafistrauss.com
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            cd rafistrauss.github.io/
            branch=$(git symbolic-ref --short HEAD)
            upstream_ref=$(git config --get "branch.$branch.merge")
            GIT_TERMINAL_PROMPT=0 git pull --ff-only https://github.com/rafistrauss/rafistrauss.github.io.git "$upstream_ref"
